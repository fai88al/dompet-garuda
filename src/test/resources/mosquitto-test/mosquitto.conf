# Test-only Mosquitto config for the Dynamic Security plugin, used by Testcontainers-based
# MQTT provisioning tests (MqttAdminClientTest / MqttProvisioningTest). Mirrors CLAUDE.md §15's
# production plugin wiring, minus TLS (plain 1883 is fine for a container-local test broker).
listener 1883
allow_anonymous false

persistence false

plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/dynsec/dynamic-security.json

log_dest stdout
log_type all
