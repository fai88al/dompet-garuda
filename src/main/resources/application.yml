spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

# Maximum amount that can be loaded into an offline pouch in one provisioning call.
# Must be provided via POUCH_MAX_AMOUNT_IDR env var. No default — require explicit config.
pouch:
  max-amount-idr: ${POUCH_MAX_AMOUNT_IDR}

# Maximum amount per online transfer (FR18). Locked value: Rp 10,000,000 (R10).
# Must be provided via TRANSFER_ONLINE_MAX_AMOUNT_IDR env var. No default — require explicit config.
transfer:
  online:
    max-amount-idr: ${TRANSFER_ONLINE_MAX_AMOUNT_IDR}

# TTL for Bayar QR Online payment requests before they expire (FR20/FR22).
# Has a default (10 min) per this feature's spec — unlike transfer.online.max-amount-idr,
# an expiry window is not a money-safety limit, so a safe default is acceptable here.
qr-payment:
  request-ttl-minutes: ${QR_PAYMENT_REQUEST_TTL_MINUTES:10}

# Days a PENDING payment-received notification (Phase 3 Feature A, CLAUDE.md §17) stays
# eligible for re-publish before NotificationExpiryJob marks it EXPIRED. Agreed with the
# client at 3 days — a delivery-metadata window, not a money-safety limit, so a default
# is acceptable (unlike transfer.online.max-amount-idr).
notification:
  reconciliation:
    expiry-days: ${NOTIFICATION_RECONCILIATION_EXPIRY_DAYS:3}
